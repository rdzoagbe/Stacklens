    <script type="application/ld+json">

      "foundingDate": "2025",
      "sameAs": [],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "FR"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Stacklens",

    <!-- ════════════════════════════════════════════════════════════════════
         Google Consent Mode v2, following the CNIL guidance
         MUST run before any analytics SDK initialises.
         All 4 consent parameters default to 'denied' (CNIL requirement).

         Accepting the banner grants ANALYTICS ONLY. The three advertising
         signals stay denied whatever the visitor clicks. The banner offers
         "analytics cookies (Google Analytics)", the privacy policy says
         analytics only, and the DPA promises no behavioural advertising —
         yet until 2026-09 every accept path also granted ad_storage,
         ad_user_data and ad_personalization. Four hand-typed copies of the
         same object had drifted; there is now one, ANALYTICS_CONSENT, and
         src/lib/claims.test.js executes this script to keep it that way.
         ════════════════════════════════════════════════════════════════════ -->
    <script src="/consent-init.js"></script>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!--
      Fallback content for agents that do not execute JavaScript. React
      renders the real page into #root for everyone else.

      This used to be a visually hidden div (aria-hidden, clip-rect) that sat
      OUTSIDE #root — so it was never replaced, and every visitor's page
      carried a second, hidden <h1> full of keywords alongside the real one.
      That is the pattern Google's hidden-text policy names, for a benefit it
      does not need since it renders JavaScript. <noscript> serves the same
      content to the same agents and is invisible to everyone else, which is
      what this was always trying to be.
    -->
    <noscript>
      <h1>Stacklens — SaaS audits for accountants and the SMBs they run</h1>
      <p>Drop a bank export and see every software subscription, duplicate, price rise and renewal in five minutes; then keep tools, people and access in order. Database stored in the EU; a published DPA and sub-processor list.</p>
      <p lang="fr">Déposez un export bancaire et voyez en cinq minutes chaque abonnement logiciel, doublon, hausse de prix et renouvellement ; puis tenez à jour outils, personnes et accès. Base de données stockée dans l'UE ; DPA et liste des sous-traitants publiés.</p>
      <p>Stacklens needs JavaScript. Please enable it to use the site. / Stacklens a besoin de JavaScript : activez-le pour utiliser le site.</p>
    </noscript>
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050816;color:#74839a;font:14px system-ui,sans-serif" aria-busy="true">Loading… / Chargement…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
