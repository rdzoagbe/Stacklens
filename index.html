    <!-- ════════════════════════════════════════════════════════════════════
         Google Consent Mode v2 — CNIL / GDPR compliant
         MUST run before any analytics SDK initialises.
         All 4 consent parameters default to 'denied' (CNIL requirement).
         ════════════════════════════════════════════════════════════════════ -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      // Default: all 4 Consent Mode v2 parameters denied until user acts
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      // Consent version — bump this when cookie categories change to re-ask users
      window.CONSENT_VERSION = 'v2-2026-04';

      // If user previously accepted (and version matches), grant consent immediately on page load
      (function() {
        try {
          var raw = localStorage.getItem('cookie_consent_v2');
          if (!raw) return;
          var stored = JSON.parse(raw);
          if (stored.version !== window.CONSENT_VERSION) return;
          // Consent expires after 6 months (CNIL minimum) — we use 13 months as ceiling
          var THIRTEEN_MONTHS_MS = 13 * 30 * 24 * 60 * 60 * 1000;
          if (Date.now() - stored.timestamp > THIRTEEN_MONTHS_MS) return;

          if (stored.choice === 'accepted') {
            gtag('consent', 'update', {
              analytics_storage: 'granted',
              ad_storage: 'granted',
              ad_user_data: 'granted',
              ad_personalization: 'granted'
            });
            loadGtagScript();
          }
        } catch (e) { /* corrupted storage — ignore, banner will re-ask */ }
      })();

      function loadGtagScript() {
        if (window.__gtag_loaded) return;
        window.__gtag_loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-MDRVRX854L';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-MDRVRX854L', { anonymize_ip: true });
      }

      // Called from React when user clicks Accept
      window.enableAnalytics = function() {
        gtag('consent', 'update', {
          analytics_storage: 'granted',
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted'
        });
        loadGtagScript();
        // Propagate to Firebase Analytics SDK if initialised
        if (window.__firebaseAnalyticsSetConsent) {
          window.__firebaseAnalyticsSetConsent({
            analytics_storage: 'granted',
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
      };

      // Called from React when user clicks Reject
      window.disableAnalytics = function() {
        gtag('consent', 'update', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
        if (window.__firebaseAnalyticsSetConsent) {
          window.__firebaseAnalyticsSetConsent({
            analytics_storage: 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          });
        }
      };
    </script>
