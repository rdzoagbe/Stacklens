name: Build & Deploy

on:
  push:
    branches:
      - main
      - claude/code-review-assessment-eAilj
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The Firestore emulator runs on the JVM, and firebase-tools requires
      # JDK 21+. The runner's default JDK is older, so the rules step fails
      # without this.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # These three used to be missing: the build job only compiled, so a
      # failing test or lint error could not block a merge. The guard suites
      # (duplicate exports, plan claims, Firestore rules) are only worth
      # writing if CI actually runs them.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Firestore security rules
        run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_WORKER_SECRET: ${{ secrets.VITE_WORKER_SECRET }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_OKTA_CLIENT_ID: ${{ secrets.VITE_OKTA_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Staging: every PR gets its own throwaway preview URL (expires in 7 days)
  # so risky UI changes can be clicked through before touching stacklens.fr.
  # Uses the production backend — it's a hosting preview, not a data sandbox.
  # Non-blocking: a preview failure never gates a merge (build stays the gate).
  preview:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACCESSGUARD_V2 }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy preview channel
        run: firebase hosting:channel:deploy "pr-${{ github.event.number }}" --expires 7d --project accessguard-v2 --non-interactive

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACCESSGUARD_V2 }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: |
          set +e
          OUT=$(firebase deploy --only hosting --project accessguard-v2 --non-interactive 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -q "current active version"; then
            echo "::notice::Identical version already live — no-op deploy, treating as success."
            exit 0
          fi
          exit $CODE

      - name: Deploy Firestore rules
        run: |
          set +e
          OUT=$(firebase deploy --only firestore:rules --project accessguard-v2 --non-interactive 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -qi "does not have permission"; then
            echo "::warning::Firestore rules NOT deployed — the CI service account lacks Firestore Rules permission. Grant roles/firebaserules.admin to github-action-1157772310@accessguard-v2.iam.gserviceaccount.com to enable automatic rules deploys."
            exit 0
          fi
          exit $CODE

  deploy-functions:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Needed to diff against the previous main. Without history the
          # comparison below cannot run, and it then falls back to deploying.
          fetch-depth: 0

      # ── Deploy functions only when functions changed ────────────────────
      #
      # Every merge to main redeployed all twenty, whatever it touched. An
      # SEO change that edited index.html and a sitemap created twenty new
      # Cloud Run revisions, took seven minutes, and failed: it ran eight
      # minutes after the previous deploy, whose fresh revisions still had
      # instances holding CPU, so batch 1 tipped over "Total allowable CPU
      # per project per region" and `ai` could not start.
      #
      # firebase.json and this workflow count as function changes: the first
      # carries function config, the second carries the batch list itself.
      #
      # Every uncertain case deploys. Skipping a needed function deploy is
      # the dangerous direction — it ships hosting against server code that
      # never went out, silently, which is the failure deploy-batches.test.js
      # exists to prevent. A wasted deploy only costs seven minutes.
      - name: Decide whether functions need deploying
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "reason=no previous commit to compare against" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "reason=previous commit $BEFORE is not in this checkout" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only "$BEFORE" "$AFTER" >/dev/null 2>&1; then
            echo "reason=could not diff, deploying to be safe" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Test files under functions/ are never deployed, so a change to one
          # is not a reason to restart twenty Cloud Run services. The first
          # version of this gate did not exclude them, and the very merge that
          # introduced it redeployed everything because it had touched
          # functions/deploy-batches.test.js — then failed on the quota the
          # gate exists to avoid.
          changed=$(git diff --name-only "$BEFORE" "$AFTER" \
            -- functions/ firebase.json .github/workflows/build.yml \
            | grep -v -E '^functions/.*\.test\.js$' || true)
          if [ -n "$changed" ]; then
            echo "reason=changed: $(echo "$changed" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no changes under functions/, firebase.json or the workflow" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # A skipped deploy must be visible in the log, not inferred from four
      # greyed-out steps.
      - name: Report the decision
        run: |
          echo "deploy functions: ${{ steps.scope.outputs.deploy }}"
          echo "reason: ${{ steps.scope.outputs.reason }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACCESSGUARD_V2 }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Deployed in batches, not all nineteen at once.
      #
      # `firebase deploy --only functions` updates every function in parallel.
      # Each one being updated has to start a container to pass a Cloud Run
      # health check, and each of those needs real CPU — so nineteen at once
      # exceeded "Total allowable CPU per project per region" and the deploy
      # failed with fifteen functions unable to start.
      #
      # Batches of five need a fifth of the concurrent headroom. Slower, and it
      # completes. `|| exit 1` on each keeps a failing batch failing the job
      # rather than being masked by a later success.
      #
      # Every exported function must appear in exactly one batch below. A
      # function missing from all of them is silently never deployed, so
      # functions/deploy-batches.test.js compares this list against the
      # exports in functions/index.js and fails the build if they diverge.
      - name: Deploy Cloud Functions (batch 1/4)
        if: steps.scope.outputs.deploy == 'true'
        run: firebase deploy --project accessguard-v2 --force --non-interactive --only functions:ai,functions:api,functions:apikeys,functions:bankfeed,functions:clientErrors

      - name: Let batch 1 drain before batch 2
        if: steps.scope.outputs.deploy == 'true'
        run: sleep 90
      - name: Deploy Cloud Functions (batch 2/4)
        if: steps.scope.outputs.deploy == 'true'
        run: firebase deploy --project accessguard-v2 --force --non-interactive --only functions:createCheckout,functions:createPortal,functions:dailyAlerts,functions:founderops,functions:integrations

      - name: Let batch 2 drain before batch 3
        if: steps.scope.outputs.deploy == 'true'
        run: sleep 90
      - name: Deploy Cloud Functions (batch 3/4)
        if: steps.scope.outputs.deploy == 'true'
        run: firebase deploy --project accessguard-v2 --force --non-interactive --only functions:invoiceInbound,functions:invoiceInbox,functions:refreshClaims,functions:sendInvite,functions:stripeWebhook

      - name: Let batch 3 drain before batch 4
        if: steps.scope.outputs.deploy == 'true'
        run: sleep 90
      - name: Deploy Cloud Functions (batch 4/4)
        if: steps.scope.outputs.deploy == 'true'
        run: firebase deploy --project accessguard-v2 --force --non-interactive --only functions:syncuser,functions:weeklyBackup,functions:weeklySummary,functions:workspace,functions:purgeClientOrgs
